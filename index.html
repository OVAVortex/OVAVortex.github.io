<div style="background: #2f3136; padding: 15px; border-radius: 8px; width: 300px; color: white; font-family: sans-serif;">
    <h3>🌐 Website Live-Chat</h3>
    <input type="text" id="chat-name" placeholder="Dein Name" style="width: 100%; margin-bottom: 8px; padding: 5px; box-sizing: border-box;"><br>
    <input type="text" id="chat-msg" placeholder="Schreibe eine Nachricht..." style="width: 100%; margin-bottom: 8px; padding: 5px; box-sizing: border-box;"><br>
    <button onclick="sendeAnDiscord()" style="background: #5865F2; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; width: 100%;">An Discord senden</button>
</div>

<script>
function sendeAnDiscord() {
    let name = document.getElementById('chat-name').value || 'Anonym';
    let nachricht = document.getElementById('chat-msg').value;
    
    if(!nachricht) return alert('Bitte gib eine Nachricht ein!');

    // WICHTIG: Da dein Bot gerade auf deinem PC läuft, nutzen wir localhost. 
    // (Später, wenn deine Website im Internet ist, ändern wir das zu deiner echten Web-Adresse).
    fetch('http://localhost:5000/api/chat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            username: name,
            message: nachricht
        }),
    })
    .then(response => response.json())
    .then(data => {
        alert('Nachricht erfolgreich an Discord gesendet!');
        document.getElementById('chat-msg-msg').value = ''; // Eingabe leeren
    })
    .catch((error) => {
        console.error('Fehler:', error);
        alert('Fehler! Läuft dein Python-Bot in der CMD noch?');
    });
}
</script>
